{{- if .Values.secrets.create }}
{{- /*
  ТОЛЬКО ДЛЯ РАЗРАБОТКИ. Ключ не генерируется: он должен быть создан и сохранён вне кластера.
  Потеря ключа означает потерю всех секретов в БД (ADR-0008). Аннотация keep оставляет Secret
  после `helm uninstall`, чтобы ключ не исчез вместе с релизом.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubron.secretName" . }}
  labels:
    {{- include "kubron.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.secrets.keys.secretKey }}: {{ required "secrets.values.secretKey is required when secrets.create=true (format id:base64, 32 bytes; the chart never generates a key)" .Values.secrets.values.secretKey | quote }}
  {{ .Values.secrets.keys.databaseUrl }}: {{ required "secrets.values.databaseUrl is required when secrets.create=true" .Values.secrets.values.databaseUrl | quote }}
{{- end }}
