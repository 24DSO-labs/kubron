{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubron.fullname" . }}
  labels:
    {{- include "kubron.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubron.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.ingress.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      {{- with .Values.networkPolicy.egress.dns.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # PostgreSQL
    - ports:
        {{- range .Values.networkPolicy.egress.postgres.ports }}
        - port: {{ int . }}
          protocol: TCP
        {{- end }}
      {{- with .Values.networkPolicy.egress.postgres.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # API-серверы кластеров и провайдеры OIDC. По умолчанию открыто, см. values.yaml (политика SSRF, раздел 8 плана)
    - ports:
        {{- range .Values.networkPolicy.egress.clusterApi.ports }}
        - port: {{ int . }}
          protocol: TCP
        {{- end }}
      {{- with .Values.networkPolicy.egress.clusterApi.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.networkPolicy.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
