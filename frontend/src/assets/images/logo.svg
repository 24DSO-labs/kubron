    <text x="0" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" letter-spacing="2">
      <tspan fill="#F8FAFC">KUB</tspan><tspan fill="url(#text-grad)">RON</tspan>
    </text>

