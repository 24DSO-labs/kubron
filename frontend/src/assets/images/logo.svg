  <!-- Темный фон (уберите <rect>, если нужен прозрачный SVG) -->
  <!-- <rect width="100%" height="100%" fill="#0B0F19" rx="16" /> -->

  <!-- ИКОНКА (Geometric 'K' Cluster) -->
