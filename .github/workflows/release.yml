name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Пробный прогон сборок без публикации: PR, меняющий этот файл
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Тег проходит те же проверки, что и ветка: не полагаемся на то, что CI уже видел этот коммит.
  # На PR, меняющем только release.yml, пробная сборка идёт без полного CI.
  verify:
    name: Verify
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    if: ${{ !cancelled() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
          - name: linux-amd64
            os: ubuntu-24.04
            platform: linux/amd64
            build_args: -tags webkit2_41
          - name: macos-universal
            os: macos-latest
            platform: darwin/universal
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"   # 0.1.0-rc.1 -> 0.1.0
          wails_v="$(jq -r .info.productVersion wails.json)"
          npm_v="$(jq -r .version frontend/package.json)"
          if [ "$base" != "$wails_v" ] || [ "$base" != "$npm_v" ]; then
            echo "Tag $GITHUB_REF_NAME does not match wails.json ($wails_v) / package.json ($npm_v)"
            exit 1
          fi

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: ./.github/actions/linux-build-deps
        if: runner.os == 'Linux'

      - name: Wails CLI
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: wails build -clean -platform ${{ matrix.platform }} ${{ matrix.build_args }}

      - name: Package
        env:
          ASSET: Kubron_${{ github.ref_type == 'tag' && github.ref_name || 'snapshot' }}_${{ matrix.name }}
        run: |
          mkdir -p dist
          case "$RUNNER_OS" in
            Windows) powershell -NoProfile -Command "Compress-Archive -Path build/bin/Kubron.exe -DestinationPath dist/$ASSET.zip" ;;
            Linux)   tar -C build/bin -czf "dist/$ASSET.tar.gz" Kubron ;;
            macOS)   ditto -c -k --keepParent build/bin/Kubron.app "dist/$ASSET.zip" ;;
          esac
          ls -l dist

      - name: Build .deb
        if: runner.os == 'Linux'
        env:
          NFPM_VERSION: "2.46.3"
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then ver="${GITHUB_REF_NAME#v}"; else ver="0.0.0-snapshot"; fi
          # '-' в SemVer — разделитель ревизии Debian: 1.2.3-rc.1 в dpkg старше 1.2.3.
          # '~' сортируется раньше всего, поэтому предрелиз остаётся младше релиза.
          deb_version="${ver/-/\~}"
          deb_name="kubron_${deb_version}_amd64.deb"
          # go install проверяется по sum.golang.org, чего не умеет скачанный бинарь релиза
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@v${NFPM_VERSION}"
          VERSION="$deb_version" nfpm package \
            --config build/linux/nfpm.yaml --packager deb --target "dist/${deb_name}"

          # Имя файла и поле Version обязаны совпадать, содержимое — быть ожидаемым
          dpkg-deb --info "dist/${deb_name}"
          [ "$(dpkg-deb --field "dist/${deb_name}" Version)" = "$deb_version" ]
          contents="$(dpkg-deb --contents "dist/${deb_name}")"
          for f in ./usr/bin/kubron ./usr/share/applications/kubron.desktop \
                   ./usr/share/doc/kubron/LICENSE ./usr/share/doc/kubron/NOTICE; do
            grep -qF "$f" <<<"$contents" || { echo "В .deb нет $f"; exit 1; }
          done
          base="${deb_version%%[~+]*}"
          if [ "$deb_version" != "$base" ]; then
            dpkg --compare-versions "$deb_version" lt "$base"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kubron-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Подтверждение происхождения: связывает бинарь с коммитом и запуском workflow
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          pattern: kubron-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum Kubron_* kubron_*.deb > SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/Kubron_*
            dist/kubron_*.deb

      # Описание релиза берётся из CHANGELOG.md (раздел версии; для rc-тегов без раздела: [Unreleased])
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/changelog.mjs notes "${TAG#v}" --fallback-unreleased > notes.md
          prev="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo
            cat .github/release-footer.md
            if [ -n "$prev" ]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$prev" "$TAG"
            fi
          } >> notes.md
          cat notes.md

      # Релиз неизменяемый (Immutable): сначала черновик со всеми файлами, затем публикация.
      # Оставить черновик для ручной проверки: переменная репозитория RELEASE_AUTO_PUBLISH=false.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          AUTO_PUBLISH: ${{ vars.RELEASE_AUTO_PUBLISH }}
        run: |
          flags=""
          case "$TAG" in v0.*|*-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Kubron $TAG" --notes-file notes.md $flags
          if [ "$AUTO_PUBLISH" != "false" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
            echo "Релиз опубликован: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Создан черновик релиза $TAG (RELEASE_AUTO_PUBLISH=false), опубликуйте его вручную" >> "$GITHUB_STEP_SUMMARY"
          fi
