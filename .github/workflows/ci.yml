name: CI

on:
  push:
    branches: [main, master, dev, refactor]
  pull_request:

permissions:
  contents: read

# Новый push в PR отменяет прежний прогон; прогоны веток (dev, master) не отменяются
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Wails на Linux собирается с webkit2gtk 4.1
  GO_TAGS: webkit2_41

jobs:
  dco:
    name: DCO (Signed-off-by)
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: scripts/check-dco.sh "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"

  headers:
    name: License headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/license-headers.py
      - run: node scripts/changelog.mjs check

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: System libraries (cgo, webkit)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Stub frontend/dist
        run: mkdir -p frontend/dist && touch frontend/dist/.keep

      # Go: только разрешённые лицензии (свой модуль kubron не проверяем).
      # go-licenses v1 не имеет флага --include_tags: теги сборки передаются через GOFLAGS.
      - name: go-licenses
        env:
          GOFLAGS: -tags=${{ env.GO_TAGS }}
        run: |
          go install github.com/google/go-licenses@v1.6.0
          go-licenses check ./... --ignore github.com/VadimIl224/kubron \
            --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-3-Clause,MIT,ISC,MPL-2.0

      # Фронтенд: только production-зависимости
      - run: npm ci
        working-directory: frontend
      - name: license-checker
        working-directory: frontend
        run: npx --yes license-checker-rseidelsohn@4.4.2 --production --excludePrivatePackages --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD"

  go:
    name: Go (build, vet, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: System libraries (cgo, webkit)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # main.go встраивает frontend/dist (//go:embed): для Go-проверок достаточно заглушки
      - name: Stub frontend/dist
        run: mkdir -p frontend/dist && touch frontend/dist/.keep

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - run: go vet -tags $GO_TAGS ./...
      - run: go build -tags $GO_TAGS ./...
      - run: go test -tags $GO_TAGS ./...

      # pkg/ext и пример внешнего модуля — отдельные Go-модули (go test ./... в корне их не видит)
      - name: pkg/ext
        run: go vet ./... && go test ./...
        working-directory: pkg/ext
      - name: examples/ext-authenticator (внешний модуль собирается без правок ядра)
        run: go vet ./... && go test ./...
        working-directory: examples/ext-authenticator

  # SQL-схема сервиса: применяется и откатывается на настоящем PostgreSQL (задача 3.1a).
  migrations:
    name: SQL migrations (PostgreSQL 16)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-migrations.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Integration tests of the PostgreSQL store
        env:
          KUBRON_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/kubron_test?sslmode=disable
        run: |
          psql -c 'CREATE DATABASE kubron_test'
          go test -race -count=1 ./internal/pgstore/ ./internal/migrate/ ./internal/secretbox/

  lint:
    name: Go (golangci-lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: System libraries (cgo, webkit)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Stub frontend/dist
        run: mkdir -p frontend/dist && touch frontend/dist/.keep
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  frontend:
    name: Frontend (test, type-check, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: System libraries (cgo, webkit)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)

      - run: npm ci
        working-directory: frontend

      # Юнит-тесты герметичны: Wails-runtime подменяется плагином wails-runtime-stub в vite.config.ts,
      # поэтому им не нужны Wails-биндинги и тесты идут до генерации
      - run: npm test
        working-directory: frontend

      # полнота переводов и ссылки на ключи (без зависимостей, см. docs/i18n.md)
      - run: npm run i18n:check
        working-directory: frontend

      # frontend/wailsjs генерируется из Go-кода и не хранится в репозитории: без него vue-tsc не пройдёт
      - name: Generate Wails bindings
        run: |
          mkdir -p frontend/dist && touch frontend/dist/.keep
          wails generate module -tags $GO_TAGS

      - run: npm run build
        working-directory: frontend

  # Сквозная проверка веб-версии: браузер → kubron-server → kind (docs/e2e.md).
  # Блокирует сборку: gate этапов 1 и 2 (в том числе два пользователя одновременно).
  e2e:
    name: E2E (web, Playwright + kind)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: System libraries (cgo, webkit)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)

      - run: npm ci
        working-directory: frontend

      # Типы для vue-tsc берутся из сгенерированных Wails-биндингов
      - name: Generate Wails bindings
        run: |
          mkdir -p frontend/dist && touch frontend/dist/.keep
          wails generate module -tags $GO_TAGS

      - name: Build web frontend and server
        run: |
          npm run build:web
          cd .. && go build -tags "$GO_TAGS" -o kubron-server ./cmd/kubron-server
        working-directory: frontend

      - name: kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kubron-e2e

      - name: Pod with a shell for the terminal test
        run: |
          kubectl run e2e-shell --image=busybox:1.36 --restart=Never -- sleep 3600
          kubectl wait --for=condition=Ready pod/e2e-shell --timeout=120s
          # Под, который пишет в stdout: нужен тесту «события и логи доходят только владельцу»
          kubectl run e2e-logs --image=busybox:1.36 --restart=Never -- sh -c 'while true; do echo tick; sleep 1; done'
          kubectl wait --for=condition=Ready pod/e2e-logs --timeout=120s

      - name: Export kubeconfig
        run: kind export kubeconfig --name kubron-e2e --kubeconfig "$RUNNER_TEMP/kind.kubeconfig"

      - name: Start kubron-server
        run: |
          export KUBRON_DATA_DIR="$RUNNER_TEMP/kubron-data"
          mkdir -p "$KUBRON_DATA_DIR"
          ./kubron-server --listen 127.0.0.1:8080 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1

      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Playwright
        run: npx playwright test
        working-directory: frontend
        env:
          E2E_KUBECONFIG: ${{ runner.temp }}/kind.kubeconfig
          E2E_TERMINAL_POD: default/e2e-shell/e2e-shell
          E2E_LOG_POD: default/e2e-logs/e2e-logs

      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
