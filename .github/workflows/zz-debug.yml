name: zz-debug
on:
  push:
    branches: [feat/pfproxy]
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: stable
      - uses: ./.github/actions/linux-build-deps
      - run: mkdir -p frontend/dist && touch frontend/dist/.keep
      - name: test
        run: |
          go test -tags webkit2_41 ./... 2>&1 | tee /tmp/out.txt || true
          grep -E "^(--- FAIL|FAIL|panic|\s+\S+_test\.go:[0-9]+:)" /tmp/out.txt | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
