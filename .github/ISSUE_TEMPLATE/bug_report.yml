name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please **remove secrets** (tokens, kubeconfig contents,
        Secret values) from anything you paste below.
        For security problems use [private reporting](https://github.com/VadimIl224/kubron/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: Kubron version
      placeholder: "e.g. v1.0.0 or commit hash"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Desktop app
        - Web mode (experimental)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Windows 11, Ubuntu 24.04, macOS 15"
    validations:
      required: true
  - type: input
    id: k8s
    attributes:
      label: Kubernetes version and distribution
      placeholder: "e.g. v1.31, EKS / k3s / kind"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
      