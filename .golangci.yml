version: "2"

run:
  timeout: 5m
  build-tags:
    - webkit2_41

linters:
  default: standard
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Тексты ошибок начинаются с имён собственных (Argo CD) и показываются пользователю
        - -ST1005
        # Чисто косметические предложения по упрощению кода
        - -QF1001
        - -QF1002
        - -QF1007
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
      # Close() в defer и при выходе по ошибке: проверять нечего.
      # Записывающие пути (audit, auth) проверяют итоговый Close() явно.
      - linters:
          - errcheck
        text: 'Error return value of .*Close` is not checked'
