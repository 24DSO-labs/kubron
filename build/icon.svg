<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Квадратная иконка приложения Kubron: знак "K" из logo.svg на тёмном фоне -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="k-grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="k-grad-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="k-grad-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <!-- Тёмный фон со скруглёнными углами (в тон BackgroundColour окна: #1E1E2E) -->
  <rect width="512" height="512" rx="100" fill="#1E1E2E" />

  <!-- Знак "K" (Geometric 'K' Cluster), отцентрирован и масштабирован -->
  <g transform="translate(256 256) scale(3.5) translate(-104 -104)">
    <!-- Левая стойка буквы K -->
    <polygon points="48,65 70,52.5 70,142.5 48,155" fill="#0284C7" />
    <polygon points="70,52.5 92,40 92,130 70,142.5" fill="url(#k-grad-main)" />

    <!-- Верхний блок -->
    <polygon points="104,33 160,65 160,110 104,78" fill="url(#k-grad-top)" />

    <!-- Нижний блок -->
    <polygon points="104,98 160,130 160,175 104,143" fill="url(#k-grad-bottom)" />
  </g>
</svg>
