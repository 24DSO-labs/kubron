# Openkubron Monitoring Components
# Unified manifest for lens-metrics namespace with all required components

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: kubron-metrics
  labels:
    app.kubernetes.io/name: kubron-metrics
    app.kubernetes.io/managed-by: kubron
    app.kubernetes.io/created-by: resource-stack

---
# ServiceAccount для Kube State Metrics
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: kubron-metrics
  labels:
    app.kubernetes.io/name: kubron-metrics
    app.kubernetes.io/managed-by: kubron
    app.kubernetes.io/created-by: resource-stack

---
# ServiceAccount для Prometheus
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: kubron-metrics
  labels:
    app.kubernetes.io/name: kubron-metrics
    app.kubernetes.io/managed-by: kubron
    app.kubernetes.io/created-by: resource-stack

---
# ClusterRole для Kube State Metrics
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubron-kube-state-metrics
  labels:
    app.kubernetes.io/name: kubron-metrics
    app.kubernetes.io/managed-by: kubron
    app.kubernetes.io/created-by: resource-stack
rules:
- apiGroups: [""]
  resources: [configmaps, secrets, nodes, pods, services, resourcequotas, replicationcontrollers, limitranges, persistentvolumeclaims, persistentvolumes, namespaces, endpoints]
  verbs: [list, watch]
- apiGroups: [apps]
  resources: [statefulsets, daemonsets, deployments, replicasets]
  verbs: [list, watch]
- apiGroups: [batch]
  resources: [cronjobs, jobs]
  verbs: [list, watch]
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  verbs: [list, watch]
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: [list, watch]
- apiGroups: [storage.k8s.io]
  resources: [storageclasses, volumeattachments]
  verbs: [list, watch]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies, ingresses]
  verbs: [list, watch]
- apiGroups: [admissionregistration.k8s.io]
  resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
  verbs: [list, watch]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [list, watch]
- apiGroups: [certificates.k8s.io]
  resources: [certificatesigningrequests]
  verbs: [list, watch]

---
# ClusterRoleBinding для Kube State Metrics
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubron-kube-state-metrics
  labels:
    app.kubernetes.io/name: kubron-metrics
    app.kubernetes.io/managed-by: kubron
    app.kubernetes.io/created-by: resource-stack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubron-kube-state-metrics
subjects:
- kind: ServiceAccount
  name: kube-state-metrics
  namespace: kubron-metrics

---
# ClusterRole для Prometheus
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubron-prometheus
  labels:
    app.kubernetes.io/name: kubron-metrics
    app.kubernetes.io/managed-by: kubron
    app.kubernetes.io/created-by: resource-stack
rules:
- apiGroups: [""]
  resources: [nodes, nodes/proxy, nodes/metrics, services, endpoints, pods, configmaps, secrets]
  verbs: [get, list, watch]
- apiGroups: [extensions]
  resources: [ingresses]
  verbs: [get, list, watch]
- apiGroups: [networking.k8s.io]
  resources: [ingresses]
  verbs: [get, list, watch]
- nonResourceURLs: [/metrics, /metrics/cadvisor]
  verbs: [get]

---
# ClusterRoleBinding для Prometheus
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubron-prometheus
  labels:
    app.kubernetes.io/name: kubron-metrics
    app.kubernetes.io/managed-by: kubron
    app.kubernetes.io/created-by: resource-stack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubron-prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: kubron-metrics

---
# ConfigMap для конфигурации Prometheus
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: kubron-metrics
  labels:
    app.kubernetes.io/name: kubron-metrics
    app.kubernetes.io/managed-by: kubron
    app.kubernetes.io/created-by: resource-stack
data:
  prometheus.yaml: |-
    # Global config
    global:
      scrape_interval: 15s

    scrape_configs:
    - job_name: 'kubernetes-apiservers'
      kubernetes_sd_configs:
      - role: endpoints
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https
      - replacement: apiserver
        action: replace
        target_label: job

    - job_name: 'kubelet'
      kubernetes_sd_configs:
      - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - replacement: 'kubron-metrics'
        target_label: kubernetes_namespace
      metric_relabel_configs:
      - source_labels: [namespace]
        action: replace
        regex: (.+)
        target_label: kubernetes_namespace

    - job_name: 'kubernetes-cadvisor'
      kubernetes_sd_configs:
      - role: node
      scheme: https
      metrics_path: /metrics/cadvisor
      tls_config:
        insecure_skip_verify: true
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      metric_relabel_configs:
      - source_labels: [namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [pod]
        regex: (.*)
        replacement: $1
        action: replace
        target_label: pod_name
      - source_labels: [container]
        regex: (.*)
        replacement: $1
        action: replace
        target_label: container_name

    - job_name: 'etcd'
      kubernetes_sd_configs:
      - role: pod
      scheme: http
      relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]
        action: keep
        regex: 'kube-system'
      - source_labels: [__meta_kubernetes_pod_label_component]
        action: keep
        regex: 'etcd-scraper-proxy'
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)

    - job_name: 'kubernetes-service-endpoints'
      kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - kubron-metrics
      relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
        action: replace
        target_label: __scheme__
        regex: (https?)
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
      - action: labelmap
        regex: __meta_kubernetes_service_label_(.+)
      - source_labels: [__meta_kubernetes_service_name]
        action: replace
        target_label: job
      - action: replace
        source_labels:
        - __meta_kubernetes_pod_node_name
        target_label: kubernetes_node
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      metric_relabel_configs:
      - source_labels: [namespace]
        action: replace
        regex: (.+)
        target_label: kubernetes_namespace

    - job_name: 'kubernetes-services'
      metrics_path: /probe
      params:
        module: [http_2xx]
      kubernetes_sd_configs:
      - role: service
        namespaces:
          names:
            - kubron-metrics
      relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_probe]
        action: keep
        regex: true
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox
      - source_labels: [__param_target]
        target_label: instance
      - action: labelmap
        regex: __meta_kubernetes_service_label_(.+)
      - source_labels: [__meta_kubernetes_service_name]
        target_label: job
      metric_relabel_configs:
      - source_labels: [namespace]
        action: replace
        regex: (.+)
        target_label: kubernetes_namespace

    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - kubron-metrics
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
      metric_relabel_configs:
      - source_labels: [namespace]
        action: replace
        regex: (.+)
        target_label: kubernetes_namespace

---
# ConfigMap для правил Prometheus
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: kubron-metrics
  labels:
    app.kubernetes.io/name: kubron-metrics
    app.kubernetes.io/managed-by: kubron
    app.kubernetes.io/created-by: resource-stack
data:
  prometheus.rules.yaml: |
    groups:
    - name: prometheus.rules
      rules:
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          description: Reloading Prometheus' configuration has failed for {{$labels.namespace}}/{{$labels.pod}}

---
# Service для Node Exporter
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: kubron-metrics
  annotations:
    prometheus.io/scrape: "true"
  labels:
    app.kubernetes.io/name: kubron-metrics
    app.kubernetes.io/managed-by: kubron
    app.kubernetes.io/created-by: resource-stack
    name: node-exporter
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    name: node-exporter
    phase: prod
  ports:
  - name: metrics
    port: 80
    targetPort: 9100
    protocol: TCP

---
# Service для Kube State Metrics
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: kubron-metrics
  annotations:
    prometheus.io/scrape: "true"
  labels:
    app.kubernetes.io/name: kubron-metrics
    app.kubernetes.io/managed-by: kubron
    app.kubernetes.io/created-by: resource-stack
    name: kube-state-metrics
spec:
  type: ClusterIP
  selector:
    name: kube-state-metrics
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP

---
# Service для Prometheus
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: kubron-metrics
  annotations:
    prometheus.io/scrape: "true"
  labels:
    app.kubernetes.io/name: kubron-metrics
    app.kubernetes.io/managed-by: kubron
    app.kubernetes.io/created-by: resource-stack
    name: prometheus
spec:
  type: ClusterIP
  selector:
    name: prometheus
  ports:
  - name: web
    port: 80
    targetPort: 9090
    protocol: TCP

---
# Node Exporter DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: kubron-metrics
  labels:
    app.kubernetes.io/name: kubron-metrics
    app.kubernetes.io/managed-by: kubron
    app.kubernetes.io/created-by: resource-stack
spec:
  selector:
    matchLabels:
      name: node-exporter
      phase: prod
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        name: node-exporter
        phase: prod
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      containers:
      - name: node-exporter
        image: quay.io/prometheus/node-exporter:v1.7.0
        imagePullPolicy: IfNotPresent
        args:
        - --path.procfs=/host/proc
        - --path.sysfs=/host/sys
        - --path.rootfs=/host/root
        - --collector.filesystem.ignored-mount-points=^/(dev|proc|sys|var/lib/docker|var/lib/containerd|var/lib/containers/.+)($|/)
        - --collector.filesystem.ignored-fs-types=^(autofs|binfmt_misc|cgroup|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|sysfs|tracefs)$
        ports:
        - containerPort: 9100
          name: metrics
          protocol: TCP
        resources:
          limits:
            cpu: 200m
            memory: 100Mi
          requests:
            cpu: 10m
            memory: 24Mi
        volumeMounts:
        - mountPath: /host/proc
          name: proc
          readOnly: true
        - mountPath: /host/sys
          name: sys
          readOnly: true
        - mountPath: /host/root
          name: root
          readOnly: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - effect: NoSchedule
        operator: Exists
      volumes:
      - hostPath:
          path: /proc
          type: ""
        name: proc
      - hostPath:
          path: /sys
          type: ""
        name: sys
      - hostPath:
          path: /
          type: ""
        name: root

---
# Kube State Metrics Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: kubron-metrics
  labels:
    app.kubernetes.io/name: kubron-metrics
    app.kubernetes.io/managed-by: kubron
    app.kubernetes.io/created-by: resource-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      name: kube-state-metrics
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        name: kube-state-metrics
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      containers:
      - name: kube-state-metrics
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.11.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 150Mi
          requests:
            cpu: 10m
            memory: 32Mi
      serviceAccountName: kube-state-metrics
      terminationGracePeriodSeconds: 30

---
# Prometheus StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: kubron-metrics
  labels:
    app.kubernetes.io/name: kubron-metrics
    app.kubernetes.io/managed-by: kubron
    app.kubernetes.io/created-by: resource-stack
spec:
  replicas: 1
  serviceName: prometheus
  selector:
    matchLabels:
      name: prometheus
  template:
    metadata:
      labels:
        name: prometheus
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      initContainers:
      - name: chown
        image: docker.io/alpine:3.19
        imagePullPolicy: IfNotPresent
        command: [chown, -R, 65534:65534, /var/lib/prometheus]
        volumeMounts:
        - mountPath: /var/lib/prometheus
          name: data
      containers:
      - name: prometheus
        image: quay.io/prometheus/prometheus:v2.55.1
        imagePullPolicy: IfNotPresent
        args:
        - --web.listen-address=0.0.0.0:9090
        - --config.file=/etc/prometheus/prometheus.yaml
        - --storage.tsdb.path=/var/lib/prometheus
        - --storage.tsdb.retention.time=2d
        - --storage.tsdb.retention.size=5GiB
        - --storage.tsdb.min-block-duration=2h
        - --storage.tsdb.max-block-duration=2h
        ports:
        - containerPort: 9090
          name: web
          protocol: TCP
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /-/healthy
            port: 9090
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /-/ready
            port: 9090
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
        volumeMounts:
        - mountPath: /etc/prometheus
          name: config
        - mountPath: /etc/prometheus/rules
          name: rules
        - mountPath: /var/lib/prometheus
          name: data
      serviceAccountName: prometheus
      terminationGracePeriodSeconds: 30
      volumes:
      - name: config
        configMap:
          defaultMode: 420
          name: prometheus-config
      - name: rules
        configMap:
          defaultMode: 420
          name: prometheus-rules
      - name: data
        emptyDir:
          sizeLimit: 20Gi
